name: Probe Secret Length

# Temporary diagnostic: prints only the byte length of TURNSTILE_SECRET.
# Secret values are masked by Actions; a length is not sensitive and is the
# only way to verify byte fidelity of the stored value.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret length
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          echo "TURNSTILE_SECRET length: ${#TURNSTILE_SECRET}"
          echo "first char is 0: $([ "${TURNSTILE_SECRET:0:1}" = "0" ] && echo yes || echo no)"
          echo "ends with 8: $([ "${TURNSTILE_SECRET: -1}" = "8" ] && echo yes || echo no)"
