# bundle patch for the better-session-manager plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/better-session-manager`.
- insert:
    - id: ui-better-session-manager
      name: '@linxin666/dsh-client-ui-better-session-manager'
